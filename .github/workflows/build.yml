# GerdaLRS CI — native tests only.
# Upstream ExpressLRS build.yml compiles every UART/STLINK target and uploads
# to the ExpressLRS artifactory. That matrix is disabled here on purpose:
# this fork must not publish to expresslrs S3, and a full firmware matrix is
# too large for the first bring-up PR.
name: GerdaLRS
on: [push, pull_request]
jobs:
  native-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio wheel
      - name: Native tests
        run: |
          cd src
          platformio pkg install --platform native
          PLATFORMIO_BUILD_FLAGS="-DRegulatory_Domain_ISM_2400" pio test -e native
